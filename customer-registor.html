```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Garage Dost</title>

    <link rel="stylesheet"
          href="garage-dost.css">

</head>

<body>

<header>

    <div class="logo">
        🚗 Garage Dost
    </div>

    <a href="index.html"
       class="btn">
        Home
    </a>

</header>


<main class="form-page">

    <div class="form-card">

        <h1>👤 Create Account</h1>

        <p class="subtitle">
            Become a Garage Dost customer.
        </p>


       <form onsubmit="registerCustomer(event)">

    <input
        type="text"
        id="name"
        placeholder="Enter Name"
        required
    >

    <input
        type="tel"
        id="phone"
        placeholder="Enter Mobile Number"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
    >

    <button type="submit">
        REGISTER
    </button>

</form>


    </div>

</main>


<script>

<script>
async function registerCustomer(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:5000/customer/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                phone: phone,
                password: password
            })
        });

        const data = await response.json();

        alert(data.message || data.error);

        if (response.ok) {
            window.location.href = "customer-login.html";
        }

    } catch (error) {
        alert("Backend server is not running!");
        console.error(error);
    }
}

</script>

</body>
</html>
```
