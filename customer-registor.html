```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Garage Dost</title>

    <link rel="stylesheet"
          href="garage-dost.css">

</head>

<body>

<header>

    <div class="logo">
        🚗 Garage Dost
    </div>

    <a href="index.html"
       class="btn">
        Home
    </a>

</header>


<main class="form-page">

    <div class="form-card">

        <h1>👤 Create Account</h1>

        <p class="subtitle">
            Become a Garage Dost customer.
        </p>


        <form onsubmit="registerCustomer(event)">

            <label>Full Name</label>

            <input
                type="text"
                placeholder="Enter your name"
                required
            >


            <label>Mobile Number</label>

            <input
                type="tel"
                placeholder="Enter mobile number"
                maxlength="10"
                required
            >


            <label>Password</label>

            <input
                type="password"
                placeholder="Create password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                placeholder="Confirm password"
                required
            >


            <button class="form-button">
                Register
            </button>

        </form>

    </div>

</main>


<script>

function registerCustomer(event) {

    event.preventDefault();

    alert(
        "✅ Registration successful!"
    );

    window.location.href =
        "customer-login.html";
}

</script>

</body>
</html>
```
