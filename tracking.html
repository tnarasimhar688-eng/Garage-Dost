<!DOCTYPE html>
<html>
<head>

    <title>Garage Dost - Live Tracking</title>

    <link
        rel="stylesheet"
        href="garage-dost.css"
    >

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        #map {
            width: 100%;
            height: 450px;
            margin-top: 20px;
            border-radius: 15px;
        }

        .tracking-container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .status-box,
        .mechanic-box {
            padding: 20px;
            margin-top: 15px;
            border-radius: 12px;
            background: #f5f5f5;
        }

    </style>

</head>

<body>

<header>

    <h2>🚗 Garage Dost</h2>

</header>


<main class="tracking-container">

    <h1>📍 Mechanic Tracking</h1>


    <div class="status-box">

        <h2 id="statusText">
            🔍 Searching for mechanic...
        </h2>

        <p id="statusMessage">
            Please wait...
        </p>

    </div>


    <div id="map"></div>


    <div class="mechanic-box">

        <h2>🔧 Mechanic</h2>

        <p id="mechanicDetails">
            Waiting for mechanic...
        </p>

    </div>

</main>


<!-- Leaflet JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

const requestId =
    localStorage.getItem("requestId");


let map;

let customerMarker;

let mechanicMarker;


// Initialize Map

function initializeMap(lat, lon) {

    map = L.map("map").setView(
        [lat, lon],
        15
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:
                "© OpenStreetMap contributors"
        }
    ).addTo(map);


    customerMarker =
        L.marker([lat, lon])
        .addTo(map)
        .bindPopup(
            "📍 Customer Location"
        )
        .openPopup();

}


// Load Request

async function loadTracking() {

    if (!requestId) {

        alert(
            "No service request found!"
        );

        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/service/requests"
        );


        const requests =
            await response.json();


        const request =
            requests.find(
                r => r.id == requestId
            );


        if (!request) {

            console.log(
                "Request not found"
            );

            return;
        }


        updateTracking(request);

    }

    catch (error) {

        console.error(error);

    }

}


// Update Tracking

function updateTracking(request) {

    const customerLat =
        parseFloat(request.latitude);

    const customerLon =
        parseFloat(request.longitude);


    // Initialize map only once

    if (!map) {

        initializeMap(
            customerLat,
            customerLon
        );

    }


    // Status

    document.getElementById(
        "statusText"
    ).innerText =
        getStatusText(
            request.status
        );


    document.getElementById(
        "statusMessage"
    ).innerText =
        getStatusMessage(
            request.status
        );


    // Mechanic

    if (
        request.mechanic_latitude &&
        request.mechanic_longitude
    ) {

        const mechanicLat =
            parseFloat(
                request.mechanic_latitude
            );

        const mechanicLon =
            parseFloat(
                request.mechanic_longitude
            );


        if (!mechanicMarker) {

            mechanicMarker =
                L.marker(
                    [
                        mechanicLat,
                        mechanicLon
                    ]
                )
                .addTo(map)
                .bindPopup(
                    "🔧 Mechanic"
                );

        }

        else {

            mechanicMarker.setLatLng(
                [
                    mechanicLat,
                    mechanicLon
                ]
            );

        }


        // Show both locations

        const bounds =
            L.latLngBounds([
                [
                    customerLat,
                    customerLon
                ],

                [
                    mechanicLat,
                    mechanicLon
                ]
            ]);

        map.fitBounds(bounds);

    }


    document.getElementById(
        "mechanicDetails"
    ).innerText =

        request.mechanic_id
        ?
        "🔧 Mechanic ID: " +
        request.mechanic_id
        :
        "🔍 Finding mechanic...";

}


// Status Text

function getStatusText(status) {

    switch(status) {

        case "Searching":
            return "🔍 Searching for mechanic...";

        case "Mechanic Accepted":
            return "✅ Mechanic Accepted";

        case "On the Way":
            return "🚗 Mechanic is On the Way";

        case "Arrived":
            return "📍 Mechanic Arrived";

        case "Repairing":
            return "🔧 Repair in Progress";

        case "Completed":
            return "🎉 Service Completed";

        default:
            return "🔍 Searching...";

    }

}


// Status Message

function getStatusMessage(status) {

    switch(status) {

        case "Searching":
            return "Finding a nearby mechanic.";

        case "Mechanic Accepted":
            return "Your mechanic accepted the request.";

        case "On the Way":
            return "Your mechanic is travelling to you.";

        case "Arrived":
            return "Your mechanic has arrived.";

        case "Repairing":
            return "Vehicle repair is in progress.";

        case "Completed":
            return "Service completed successfully.";

        default:
            return "Please wait...";

    }

}


// Refresh every 5 seconds

setInterval(
    loadTracking,
    5000
);


// First load

loadTracking();

</script>

</body>
</html>
