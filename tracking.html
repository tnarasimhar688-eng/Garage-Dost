<!DOCTYPE html>
<html>
<head>
    <title>Garage Dost - Tracking</title>
    <link rel="stylesheet" href="garage-dost.css">
</head>

<body>

    <header>
        <h2>🚗 Garage Dost</h2>
    </header>

    <main class="tracking-container">

        <h1>Mechanic Tracking</h1>

        <div class="status-box">

            <h2 id="statusText">
                🔍 Searching for mechanic...
            </h2>

            <p id="statusMessage">
                Please wait while we find a nearby mechanic.
            </p>

        </div>

        <div class="map-box">

            <h2>📍 Location</h2>

            <p id="location">
                Loading location...
            </p>

            <a
                id="mapLink"
                href="#"
                target="_blank"
            >
                🗺️ Open Location in Google Maps
            </a>

        </div>

        <div class="mechanic-box">

            <h2>🔧 Mechanic Details</h2>

            <p id="mechanicDetails">
                Waiting for mechanic...
            </p>

        </div>

        <button onclick="checkStatus()">
            🔄 Refresh Status
        </button>

    </main>


<script>

const requestId =
    localStorage.getItem("requestId");


async function checkStatus() {

    if (!requestId) {

        alert("No service request found!");

        window.location.href = "request.html";

        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/service/requests"
        );

        const requests = await response.json();


        const request = requests.find(
            r => r.id == requestId
        );


        if (!request) {

            document.getElementById("statusText").innerText =
                "❌ Request Not Found";

            return;
        }


        updateTracking(request);

    } catch (error) {

        console.error(error);

        document.getElementById("statusText").innerText =
            "⚠️ Backend Connection Error";

    }

}


function updateTracking(request) {

    const status =
        request.status;


    const statusText =
        document.getElementById("statusText");

    const statusMessage =
        document.getElementById("statusMessage");


    if (status === "Searching") {

        statusText.innerText =
            "🔍 Searching for mechanic...";

        statusMessage.innerText =
            "Finding a nearby mechanic for you.";

    }


    else if (status === "Mechanic Accepted") {

        statusText.innerText =
            "✅ Mechanic Accepted";

        statusMessage.innerText =
            "Your mechanic has accepted the request.";

    }


    else if (status === "On the Way") {

        statusText.innerText =
            "🚗 Mechanic is On the Way";

        statusMessage.innerText =
            "Your mechanic is travelling to your location.";

    }


    else if (status === "Arrived") {

        statusText.innerText =
            "📍 Mechanic Arrived";

        statusMessage.innerText =
            "Mechanic has reached your location.";

    }


    else if (status === "Repairing") {

        statusText.innerText =
            "🔧 Repair in Progress";

        statusMessage.innerText =
            "Your vehicle is being repaired.";

    }


    else if (status === "Completed") {

        statusText.innerText =
            "🎉 Service Completed";

        statusMessage.innerText =
            "Your vehicle service has been completed.";

    }


    // Customer Location

    document.getElementById("location").innerText =
        "Latitude: " + request.latitude +
        " | Longitude: " + request.longitude;


    document.getElementById("mapLink").href =
        "https://www.google.com/maps?q=" +
        request.latitude + "," +
        request.longitude;


    // Mechanic

    if (request.mechanic_id) {

        document.getElementById("mechanicDetails").innerText =
            "🔧 Mechanic ID: " +
            request.mechanic_id;

    }

}


// Automatically check every 5 seconds

setInterval(checkStatus, 5000);


// First check

checkStatus();

</script>

</body>
</html>
