```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rate Mechanic - Garage Dost</title>

    <link rel="stylesheet"
          href="garage-dost.css">

</head>

<body>

<header>

    <div class="logo">
        🚗 Garage Dost
    </div>

</header>


<main class="form-page">

    <div class="form-card">

        <h1 style="text-align:center;">
            ⭐ Rate Your Mechanic
        </h1>

        <p class="subtitle">
            How was your Garage Dost experience?
        </p>


        <div class="stars">

            <span class="star"
                  onclick="rate(1)">☆</span>

            <span class="star"
                  onclick="rate(2)">☆</span>

            <span class="star"
                  onclick="rate(3)">☆</span>

            <span class="star"
                  onclick="rate(4)">☆</span>

            <span class="star"
                  onclick="rate(5)">☆</span>

        </div>


        <textarea
            placeholder="Write your feedback...">
        </textarea>


        <button
            class="form-button"
            onclick="submitRating()">

            ⭐ Submit Rating

        </button>

    </div>

</main>


<script>

let selectedRating = 0;


function rate(number) {

    selectedRating = number;


    const stars =
        document.querySelectorAll(
            ".star"
        );


    stars.forEach(
        function(star, index) {

            star.innerText =
                index < number
                ? "★"
                : "☆";

        }
    );

}


async function submitRating() {

    const requestId = localStorage.getItem("requestId");

    const stars = document.querySelector(
        'input[name="rating"]:checked'
    ).value;

    const feedback = document.getElementById(
        "feedback"
    ).value;

    const response = await fetch("/rating", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            request_id: requestId,
            stars: stars,
            feedback: feedback
        })
    });

    const data = await response.json();

    if (response.ok) {

        alert("Thank you for your rating ⭐");

        localStorage.removeItem("requestId");

        window.location.href = "/";

    } else {

        alert(data.error);

    }
}

    alert(
        "⭐ Thank you for rating Garage Dost!"
    );

    window.location.href =
        "index.html";
<textarea
    id="feedback"
    placeholder="Write your feedback">
</textarea>

<button onclick="submitRating()">
    Submit Rating ⭐
</button>
}

</script>

</body>
</html>
```
