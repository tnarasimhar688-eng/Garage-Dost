```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mechanic Login - Garage Dost</title>

    <link rel="stylesheet"
          href="garage-dost.css">

</head>

<body>

<header>

    <div class="logo">
        🚗 Garage Dost
    </div>

    <a href="index.html"
       class="btn">
        Home
    </a>

</header>


<main class="form-page">

    <div class="form-card">

        <h1>👨‍🔧 Mechanic Login</h1>

        <p class="subtitle">
            Login to receive nearby service requests.
        </p>


        <form onsubmit="loginMechanic(event)">

    <input
        type="tel"
        id="phone"
        placeholder="Mechanic Mobile Number"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        🔧 MECHANIC LOGIN
    </button>

</form>

<script>

async function loginMechanic(event) {

    event.preventDefault();

    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;

    try {

        const response = await fetch(
            "http://localhost:5000/mechanic/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phone: phone,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (response.ok) {

            alert("Mechanic Login Successful 🔧");

            localStorage.setItem(
                "mechanicId",
                data.mechanic.id
            );

            localStorage.setItem(
                "mechanicName",
                data.mechanic.name
            );

            window.location.href = "mechanic.html";

        } else {

            alert(data.error || "Invalid login details");

        }

    } catch (error) {

        alert("Backend server is not running!");

        console.error(error);

    }
}

</script>

</body>
</html>
```
