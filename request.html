```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Request Mechanic - Garage Dost</title>

    <link rel="stylesheet"
          href="garage-dost.css">

</head>

<body>

<header>

    <div class="logo">
        🚗 Garage Dost
    </div>

    <a href="index.html"
       class="btn">
        Home
    </a>

</header>


<main class="form-page">

    <div class="form-card">

        <h1>🚨 Request Mechanic</h1>

        <p class="subtitle">
            Your Garage Dost will come to your location.
        </p>


        <form id="requestForm">

            <label>Customer Name</label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
                required
            >


            <label>Mobile Number</label>

            <input
                type="tel"
                id="customerMobile"
                placeholder="Enter mobile number"
                required
            >


            <label>Vehicle Type</label>

            <select id="vehicleType" required>

                <option value="">
                    Select Vehicle
                </option>

                <option>🏍️ Bike</option>

                <option>🚗 Car</option>

                <option>🛺 Auto</option>

                <option>🚙 Other</option>

            </select>


            <label>Vehicle Number</label>

            <input
                type="text"
                id="vehicleNumber"
                placeholder="Example: AP21AB1234"
                required
            >


            <label>Vehicle Problem</label>

            <select id="problem" required>

                <option value="">
                    Select Problem
                </option>

                <option>🛞 Tyre Puncture</option>

                <option>🔋 Battery Problem</option>

                <option>⛽ Fuel Problem</option>

                <option>🔧 Engine Problem</option>

                <option>🚗 Vehicle Not Starting</option>

                <option>🚛 Towing Required</option>

                <option>🛠️ Other</option>

            </select>


            <label>Current Location 📍</label>

            <button
                type="button"
                class="secondary-button"
                onclick="getCustomerLocation()">

                📍 Get My Current Location

            </button>


            <div class="location-box">

                <p id="locationStatus">
                    Location not selected
                </p>

                <p id="coordinates"></p>

            </div>


            <input
                type="hidden"
                id="latitude">

            <input
                type="hidden"
                id="longitude">


            <button
                type="submit"
                class="form-button">

                🚨 Find & Request Nearby Mechanic

            </button>

        </form>

    </div>

</main>


<script>

function getLocation() {

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    document.getElementById("locationStatus").innerText =
        "Getting your location... 📍";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            document.getElementById("latitude").value = lat;
            document.getElementById("longitude").value = lon;

            document.getElementById("locationStatus").innerText =
                "Location captured successfully ✅";

            console.log("Latitude:", lat);
            console.log("Longitude:", lon);
        },

        function(error) {
            alert("Unable to get location. Please allow location permission.");
            console.log(error);
        }
    );
}


async function sendRequest(event) {

    event.preventDefault();

    const name = document.getElementById("customerName").value;
    const phone = document.getElementById("customerPhone").value;
    const vehicleType = document.getElementById("vehicleType").value;
    const vehicleNumber = document.getElementById("vehicleNumber").value;
    const problem = document.getElementById("problem").value;
    const latitude = document.getElementById("latitude").value;
    const longitude = document.getElementById("longitude").value;


    if (!latitude || !longitude) {

        alert("Please share your current location first 📍");

        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/service/request",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    customer_name: name,
                    customer_phone: phone,
                    vehicle_type: vehicleType,
                    vehicle_number: vehicleNumber,
                    problem: problem,
                    latitude: latitude,
                    longitude: longitude

                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            alert("Mechanic Request Sent Successfully! 🔧");

            localStorage.setItem(
                "requestId",
                data.request_id
            );

            window.location.href = "tracking.html";

        } else {

            alert(data.error || "Request failed");

        }


    } catch (error) {

        alert("Backend server is not running!");

        console.error(error);

    }

}

</script>

</body>
</html>
```
