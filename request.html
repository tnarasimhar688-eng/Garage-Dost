```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Request Mechanic - Garage Dost</title>

    <link rel="stylesheet"
          href="garage-dost.css">

</head>

<body>

<header>

    <div class="logo">
        🚗 Garage Dost
    </div>

    <a href="index.html"
       class="btn">
        Home
    </a>

</header>


<main class="form-page">

    <div class="form-card">

        <h1>🚨 Request Mechanic</h1>

        <p class="subtitle">
            Your Garage Dost will come to your location.
        </p>

<form onsubmit="sendRequest(event)">

    <input
        type="text"
        id="customerName"
        placeholder="Customer Name"
        required
    >

    <input
        type="tel"
        id="customerPhone"
        placeholder="Mobile Number"
        required
    >

    <select id="vehicleType" required>
        <option value="">Select Vehicle</option>
        <option value="Bike">Bike</option>
        <option value="Car">Car</option>
        <option value="Auto">Auto</option>
        <option value="Other">Other</option>
    </select>

    <input
        type="text"
        id="vehicleNumber"
        placeholder="Vehicle Number"
        required
    >

    <select id="problem" required>
        <option value="">Select Problem</option>
        <option value="Tyre Puncture">Tyre Puncture</option>
        <option value="Battery Problem">Battery Problem</option>
        <option value="Fuel Problem">Fuel Problem</option>
        <option value="Engine Problem">Engine Problem</option>
        <option value="Vehicle Not Starting">Vehicle Not Starting</option>
        <option value="Towing Required">Towing Required</option>
        <option value="Other">Other</option>
    </select>

    <button type="button" onclick="getLocation()">
        📍 Get My Current Location
    </button>

    <p id="locationStatus">Location not selected</p>

    <input type="hidden" id="latitude">
    <input type="hidden" id="longitude">

    <button type="submit">
        🚗 REQUEST MECHANIC
    </button>

        </form>

    </div>

</main>


<script>

function getLocation() {

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    document.getElementById("locationStatus").innerText =
        "Getting your location... 📍";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            document.getElementById("latitude").value = lat;
            document.getElementById("longitude").value = lon;

            document.getElementById("locationStatus").innerText =
                "Location captured successfully ✅";

            console.log("Latitude:", lat);
            console.log("Longitude:", lon);
        },

        function(error) {
            alert("Unable to get location. Please allow location permission.");
            console.log(error);
        }
    );
}


async function sendRequest(event) {

    event.preventDefault();

    const name = document.getElementById("customerName").value;
    const phone = document.getElementById("customerPhone").value;
    const vehicleType = document.getElementById("vehicleType").value;
    const vehicleNumber = document.getElementById("vehicleNumber").value;
    const problem = document.getElementById("problem").value;
    const latitude = document.getElementById("latitude").value;
    const longitude = document.getElementById("longitude").value;


    if (!latitude || !longitude) {

        alert("Please share your current location first 📍");

        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/service/request",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    customer_name: name,
                    customer_phone: phone,
                    vehicle_type: vehicleType,
                    vehicle_number: vehicleNumber,
                    problem: problem,
                    latitude: latitude,
                    longitude: longitude

                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            alert("Mechanic Request Sent Successfully! 🔧");

            localStorage.setItem(
                "requestId",
                data.request_id
            );

            window.location.href = "tracking.html";

        } else {

            alert(data.error || "Request failed");

        }


    } catch (error) {

        alert("Backend server is not running!");

        console.error(error);

    }

}

</script>

</body>
</html>
```
