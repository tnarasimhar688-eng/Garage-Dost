<h1>🔧 Garage Dost Mechanic</h1>

<h2 id="mechanicName">Mechanic</h2>

<button onclick="goOnline()">
    🟢 GO ONLINE
</button>

<p id="onlineStatus">
    You are OFFLINE
</p>

<hr>

<h2>📋 Available Service Requests</h2>

<div id="requests">
    Loading requests...
</div>


<script>

async function updateStatus(requestId, newStatus) {

    try {

        const response = await fetch(
            "http://localhost:5000/service/status",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    request_id: requestId,
                    status: newStatus
                })
            }
        );

        const data = await response.json();

        if (response.ok) {

            alert("Status Updated: " + newStatus);

            loadRequests();

        } else {

            alert(data.error || "Status update failed");

        }

    } catch (error) {

        console.error(error);

        alert("Backend server error!");

    }
}

</script>

</body>
</html>
