<h1>🔧 Garage Dost Mechanic</h1>

<h2 id="mechanicName">Mechanic</h2>

<button onclick="goOnline()">
    🟢 GO ONLINE
</button>

<p id="onlineStatus">
    You are OFFLINE
</p>

<hr>

<h2>📋 Available Service Requests</h2>

<div id="requests">
    Loading requests...
</div>


<script>

const mechanicId = localStorage.getItem("mechanicId");


async function goOnline() {

    if (!mechanicId) {

        alert("Please login first!");

        window.location.href = "mechanic-login.html";

        return;
    }


    try {

        const response = await fetch(
            "http://localhost:5000/mechanic/online",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    mechanic_id: mechanicId,
                    latitude: 0,
                    longitude: 0,
                    online: true
                })
            }
        );


        const data = await response.json();

        if (response.ok) {

            document.getElementById("onlineStatus").innerText =
                "🟢 You are ONLINE";

            alert("You are now ONLINE!");

            loadRequests();

        } else {

            alert(data.error);

        }

    } catch (error) {

        alert("Backend server is not running!");

    }
}


async function loadRequests() {

    try {

        const response = await fetch(
            "http://localhost:5000/service/requests"
        );

        const data = await response.json();

        const container =
            document.getElementById("requests");

        container.innerHTML = "";


        if (data.length === 0) {

            container.innerHTML =
                "<p>No service requests available.</p>";

            return;
        }


        data.forEach(request => {

            const div = document.createElement("div");

            div.className = "request-card";

            div.innerHTML = `

                <h3>🚗 ${request.vehicle_type}</h3>

                <p>
                    <b>Customer:</b>
                    ${request.customer_name}
                </p>

                <p>
                    <b>Phone:</b>
                    ${request.customer_phone}
                </p>

                <p>
                    <b>Vehicle:</b>
                    ${request.vehicle_number}
                </p>

                <p>
                    <b>Problem:</b>
                    ${request.problem}
                </p>

                <p>
                    📍 Location:
                    ${request.latitude},
                    ${request.longitude}
                </p>

                <button onclick="acceptRequest(${request.id})">
                    ✅ ACCEPT REQUEST
                </button>

                <hr>
            `;

            container.appendChild(div);

        });

    } catch (error) {

        console.error(error);

    }

}


async function acceptRequest(requestId) {

    try {

        const response = await fetch(
            "http://localhost:5000/service/accept",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    request_id: requestId,

                    mechanic_id: mechanicId

                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            alert("Request Accepted! 🚗🔧");

            localStorage.setItem(
                "requestId",
                requestId
            );

            window.location.href =
                "tracking.html";

        } else {

            alert(data.error);

        }

    } catch (error) {

        alert("Backend server error!");

    }

}


document.getElementById("mechanicName").innerText =
    "🔧 " + (localStorage.getItem("mechanicName") || "Mechanic");

</script>

</body>
</html>
